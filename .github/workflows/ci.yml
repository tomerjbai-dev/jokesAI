name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test
      # Type-checks the client and the server (tsc -b), then builds dist/.
      - run: npm run build

      # The OpenAI key and the cookie secret must never reach the repository or the browser bundle.
      - name: Check for secrets
        run: |
          key_pattern='sk-[A-Za-z0-9_-]{20,}'
          if git ls-files | grep -E '(^|/)\.env$'; then echo "::error::.env is tracked by git"; exit 1; fi
          if git grep -nE "$key_pattern"; then echo "::error::Possible OpenAI key in the repository"; exit 1; fi
          if grep -rnE "$key_pattern|OPENAI_API_KEY|COOKIE_SIGNING_SECRET|BUILT_IN_COOKIE_SECRET" dist; then
            echo "::error::Secret name or key found in the build output"; exit 1
          fi
          echo "No secrets found"
